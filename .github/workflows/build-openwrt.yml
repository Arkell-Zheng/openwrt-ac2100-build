#
# ImmortalWrt 云编译 workflow —— 小米/红米 AC2100 (MT7621)
# 集成 PassWall2 + OpenClash + sing-box / xray-core
# 修订 v2: 加入官方 PassWall2 feed（旧 xiaorouji 源已 404），
#          强制注入 passwall2 配置项，并在编译前后双重校验插件确实被打进固件
#
name: Build OpenWrt for AC2100

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 进 Actions 调试 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: config/ac2100.config
  DIY_SH_PART1: scripts/diy-part1.sh
  DIY_SH_PART2: scripts/diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ImmortalWrt for AC2100
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查空间 & 释放磁盘
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: 设置时区
        run: sudo timedatectl set-timezone "$TZ"

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get full-upgrade -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gcc-multilib g++-multilib \
            gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool lrzsz msmtp ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth=1 --branch $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "===== 最近提交 ====="
          git log -1 --format='%H %s (%ci)'

      - name: 更新 feeds (DIY part1 + PassWall2 官方源)
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/$DIY_SH_PART1
          bash $GITHUB_WORKSPACE/$DIY_SH_PART1
          echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> feeds.conf.default
          echo 'src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main' >> feeds.conf.default
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "===== 校验 PassWall2 包已安装进 feeds ====="
          ls -d package/feeds/passwall2/luci-app-passwall2 || { echo "ERROR: passwall2 feed 未安装"; exit 1; }

      - name: 加载自定义配置 (DIY part2 - 修改默认设置)
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/$DIY_SH_PART2
          bash $GITHUB_WORKSPACE/$DIY_SH_PART2

      - name: 生成 .config 并校验 PassWall2
        run: |
          cd openwrt
          cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config
          sed -i '/passwall2/d' .config
          echo 'CONFIG_PACKAGE_luci-app-passwall2=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray=y' >> .config
          make defconfig
          echo "===== PassWall2 配置校验 ====="
          grep -E 'passwall2' .config || true
          if ! grep -q '^CONFIG_PACKAGE_luci-app-passwall2=y' .config; then
            echo "ERROR: luci-app-passwall2 未被选中（feed 缺失或依赖不满足）"
            echo "--- feeds 中相关包 ---"
            ./scripts/feeds list 2>/dev/null | grep -iE 'passwall|lyaml|geoview|chinadns|resolveip|libuci-lua|tcping' || true
            exit 1
          fi
          echo "===== 最终 .config 摘要 ====="
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_luci-app)' .config | head -60

      - name: SSH 调试 (可选)
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event.inputs.ssh == 'true' }}
        timeout-minutes: 30

      - name: 下载 dl 库
        run: |
          set -o pipefail
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true

      - name: 编译固件
        id: compile
        run: |
          set -o pipefail
          cd openwrt
          echo "===== 开始编译，多线程 ====="
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "===== make world 完成，开始生成固件镜像 ====="
          make target/linux/install -j$(nproc) V=s 2>&1 | tee -a build.log
          echo "===== 固件镜像生成完成 ====="
          ls -lh bin/targets/ramips/mt7621/ 2>/dev/null || echo "目录不存在"
          find bin/targets/ -name '*.bin' -ls 2>/dev/null || true

      - name: 整理固件产物
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt
          echo "===== 编译后强制校验：PassWall2 确实进入固件 ====="
          grep -E '^luci-.*passwall2 ' bin/targets/ramips/mt7621/*.manifest || { echo "ERROR: manifest 中没有 luci-app-passwall2 / 中文语言包"; exit 1; }
          mkdir -p /tmp/firmware
          find bin/targets/ramips/mt7621/ -type f \( -name '*sysupgrade.bin' -o -name '*factory.bin' -o -name '*kernel1.bin' -o -name '*rootfs0.bin' -o -name 'sha256sums' -o -name '*.manifest' \) -exec cp -f {} /tmp/firmware/ \; 2>/dev/null || true
          find bin/packages/mipsel_24kc/base/ -type f -name '*.ipk' \( -name '*passwall*' -o -name '*openclash*' -o -name '*mihomo*' -o -name '*xray*' -o -name '*sing-box*' -o -name '*v2ray*' -o -name '*trojan*' -o -name '*shadowsocks*' \) -exec cp -f {} /tmp/firmware/ \; 2>/dev/null || true
          find bin/packages/mipsel_24kc/luci/ -type f -name '*.ipk' \( -name '*passwall*' -o -name '*openclash*' \) -exec cp -f {} /tmp/firmware/ \; 2>/dev/null || true
          find bin/targets/ramips/mt7621/ -type f -name '*.bin' -exec cp -f {} /tmp/firmware/ \; 2>/dev/null || true
          cd /tmp/firmware
          BIN_COUNT=$(find /tmp/firmware/ -name '*.bin' 2>/dev/null | wc -l)
          echo "找到 $BIN_COUNT 个 .bin 固件文件"
          if [ "$BIN_COUNT" -gt 0 ]; then
            sha256sum * > sha256sums.txt
            ls -lh /tmp/firmware/
          else
            echo "没有找到 .bin 固件文件"
            find $GITHUB_WORKSPACE -path '*bin/targets*' -name '*.bin' 2>/dev/null | head -20
            exit 1
          fi
          mkdir -p $GITHUB_WORKSPACE/firmware
          cp -f /tmp/firmware/* $GITHUB_WORKSPACE/firmware/
          echo "FILE_DATE=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo status=success >> $GITHUB_OUTPUT

      - name: 上传固件 artifact
        if: steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ac2100-passwall2-${{ github.run_number }}
          path: firmware/*
          retention-days: 30
          compression-level: 0

      - name: 发布固件到 Release
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ac2100-passwall2-${{ github.run_number }}
          name: ImmortalWrt AC2100 with PassWall2 #${{ github.run_number }}
          body: |
            ImmortalWrt 24.10 / ramips mt7621 / 小米 红米 AC2100
            内置 luci-app-passwall2 + 中文语言包 + OpenClash
            依赖核心：xray-core / sing-box / chinadns-ng / geoview / tcping
            sysupgrade.bin 用于从 OpenWrt 升级；从官方固件刷入请先刷 Breed
            刷机有变砖风险，请先备份原固件与 EEPROM
          files: firmware/*

      - name: 总是上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: openwrt/build.log
          retention-days: 14
          if-no-files-found: ignore
